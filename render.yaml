# FREE-ONLY assessment deployment. Free Render Postgres expires after 30 days.
# Do not attach a paid disk or upgrade service plans automatically.
databases:
  - name: boundary-db-zda25m005
    plan: free
    region: singapore
    databaseName: boundary
    user: boundary
services:
  - type: web
    name: boundary-api-zda25m005
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    numInstances: 1
    envVars:
      - key: PORT
        value: '8080'
      - key: DATABASE_URL
        fromDatabase:
          name: boundary-db-zda25m005
          property: connectionString
      - key: CORS_ORIGIN
        sync: false
  - type: web
    name: boundary-dashboard-zda25m005
    runtime: static
    buildCommand: npm --prefix frontend ci && npm --prefix frontend run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: VITE_API_URL
        sync: false
