services:
  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_PATH: /data/geofence.db
    volumes:
      - geofence-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  geofence-data:
